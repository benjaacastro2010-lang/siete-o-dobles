<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Workia: conectá trabajadores y empresas directamente, con perfiles, trabajos con fotos y reseñas.">
<title>Workia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: barra superior fija, vistas por hash (#/...) que se renderizan dentro de <main id="app"> */
:root {
  --bg: #f4f2ec;
  --surface: #ffffff;
  --surface-2: #faf8f3;
  --fg: #1d2321;
  --muted: #5f6a65;
  --line: #dcd8cd;
  --brand: #1e5b4a;
  --brand-ink: #f5f1e6;
  --brand-soft: #dcebe4;
  --accent: #e0702e;
  --accent-soft: #fbe6d8;
  --star: #e2a321;
  --danger: #b23a2a;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --radius: 14px;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1c2220; --surface-2: #212825; --fg: #ece9e1; --muted: #a2aca7;
    --line: #333c38; --brand: #5fb596; --brand-ink: #10201a; --brand-soft: #23392f;
    --accent: #f08a4b; --accent-soft: #3a281c; --star: #f0b53a; --danger: #e0705e;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
a { color: var(--brand); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }

.topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--brand); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 1.05rem; }
.logo span.ia { color: var(--accent); }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: .95rem; }
.nav a.on, .nav a:hover { background: var(--brand-soft); color: var(--brand); }

main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none; background: var(--brand); color: var(--brand-ink); }
.btn:hover { filter: brightness(1.07); }
.btn.alt { background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.sm { padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

/* Inicio */
.hero { display: grid; gap: 28px; grid-template-columns: 1.2fr 1fr; align-items: center; padding: 24px 0 8px; }
.hero h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 46ch; }
.choose { display: grid; gap: 14px; }
.choose a { text-decoration: none; color: inherit; display: block; padding: 20px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); transition: border-color .15s, transform .15s; }
.choose a:hover { border-color: var(--brand); transform: translateY(-2px); }
.choose .k { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; }
.choose .t { color: var(--muted); font-size: .95rem; }
.steps3 { display: grid; gap: 16px; grid-template-columns: repeat(3, 1fr); margin-top: 36px; }
.steps3 .n { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.6rem; }
@media (max-width: 760px) { .hero, .steps3 { grid-template-columns: 1fr; } }

/* Formularios */
.form { max-width: 640px; margin: 0 auto; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 700; }
.field .hint { font-size: .88rem; color: var(--muted); }
input[type=text], input[type=number], input[type=tel], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
textarea { min-height: 100px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.progress { display: flex; gap: 6px; margin: 4px 0 20px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.on { background: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .92rem; user-select: none; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.tag { display: inline-block; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 700; }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px; text-align: center; cursor: pointer; background: var(--surface-2); }
.drop:hover { border-color: var(--brand); }
.drop input { display: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
.thumbs .th { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
.thumbs .th img { width: 100%; height: 100%; object-fit: cover; }
.thumbs .th button { position: absolute; top: 4px; right: 4px; border: 0; border-radius: 50%; width: 24px; height: 24px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.dni-prev { max-width: 280px; border-radius: 10px; border: 1px solid var(--line); margin-top: 10px; }
.form-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
.err { color: var(--danger); font-weight: 700; font-size: .92rem; min-height: 1.2em; }

/* Explorar */
.layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
.filters { position: sticky; top: 72px; }
.filters summary { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-bottom: 4px; }
.filters[open] summary { margin-bottom: 14px; }
@media (max-width: 760px) { .filters { position: static; } }
.pcard { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
.pcard:hover { transform: translateY(-2px); border-color: var(--brand); }
.avatar { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: #fff; font-size: 1.3rem; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.sq { border-radius: 12px; }
.avatar.lg { width: 96px; height: 96px; font-size: 2.2rem; }
.stars { color: var(--star); letter-spacing: 1px; white-space: nowrap; }
.price { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.verified { color: var(--brand); font-weight: 700; font-size: .85rem; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }

/* Perfil */
.profile-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.profile-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; align-items: start; }
@media (max-width: 760px) { .profile-grid { grid-template-columns: 1fr; } }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; cursor: zoom-in; }
.facts { display: grid; gap: 10px; }
.facts div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.facts div:last-child { border-bottom: 0; }
.review { border-top: 1px solid var(--line); padding: 12px 0; }
.review:first-child { border-top: 0; }
.star-pick { display: flex; gap: 2px; font-size: 1.8rem; }
.star-pick button { background: none; border: 0; cursor: pointer; color: var(--line); padding: 0 2px; }
.star-pick button.on { color: var(--star); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 50; padding: 16px; cursor: zoom-out; }
.lightbox img { max-height: 90vh; border-radius: 10px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 700; z-index: 60; }
section + section { margin-top: 20px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#/"><span class="logo-mark">W</span><span>Work<span class="ia">ia</span></span></a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>

<script>
/* ---------- Datos ---------- */
const OFICIOS = ["Albañil","Electricista","Plomero","Gasista","Pintor","Carpintero","Herrero","Soldador","Jardinero","Mecánico","Limpieza","Cocinero","Mozo/a","Niñera","Cuidado de adultos","Chofer","Delivery","Vendedor/a","Administrativo/a","Diseñador/a","Programador/a","Peluquero/a"];
const BENEFICIOS = ["Obra social","Aguinaldo","Vacaciones pagas","Comedor / viandas","Ropa de trabajo","Transporte","Capacitación","Bonos por productividad","Trabajo remoto","Horario flexible"];
const UNIDADES = { hora: "por hora", dia: "por día", trabajo: "por trabajo", mes: "por mes" };
const KEY = "workia_db_v1";
const COLORS = ["#1e5b4a","#e0702e","#5b3fc4","#2a6fb0","#b23a6a","#7a5a1e","#2f8a6a"];

function seed() {
  const now = Date.now(), d = 864e5;
  return {
    workers: [
      { id: "t1", nombre: "Ramiro Gómez", oficios: ["Albañil","Pintor"], zona: "Córdoba Capital", sobre: "Trabajo en construcción desde los 18. Hice ampliaciones, losas, revoques y pintura de casas. Soy prolijo y cumplo con los tiempos.", precio: 25000, unidad: "dia", tel: "", fotos: [], dniOk: true, creado: now - 40*d },
      { id: "t2", nombre: "Lucía Fernández", oficios: ["Electricista"], zona: "Rosario", sobre: "Electricista matriculada. Instalaciones domiciliarias y comerciales, tableros, puesta a tierra.", precio: 9000, unidad: "hora", tel: "", fotos: [], dniOk: true, creado: now - 20*d },
      { id: "t3", nombre: "Diego Sosa", oficios: ["Plomero","Gasista"], zona: "La Plata", sobre: "Gasista matriculado y plomero. Urgencias, pérdidas, instalación de termotanques y calefactores.", precio: 30000, unidad: "trabajo", tel: "", fotos: [], dniOk: true, creado: now - 10*d },
      { id: "t4", nombre: "Camila Ruiz", oficios: ["Cocinero","Mozo/a"], zona: "CABA", sobre: "5 años en gastronomía: cocina de línea, pastelería y atención en salón. Disponible fines de semana.", precio: 7000, unidad: "hora", tel: "", fotos: [], dniOk: true, creado: now - 5*d },
    ],
    companies: [
      { id: "e1", nombre: "Constructora Andina", rubro: "Construcción", zona: "Córdoba Capital", anios: 18, obras: "Edificios residenciales en Nueva Córdoba, barrio cerrado Los Álamos, refacción del Hospital Municipal.", beneficios: ["Obra social","Aguinaldo","Ropa de trabajo","Transporte"], horario: "Lun a vie 7:00–16:00", buscan: ["Albañil","Electricista","Herrero"], sobre: "Empresa familiar de construcción con obras en todo Córdoba.", tel: "", logo: "", creado: now - 60*d },
      { id: "e2", nombre: "Bodegón Don Tito", rubro: "Gastronomía", zona: "CABA", anios: 7, obras: "Dos locales en Palermo y Almagro. Catering para eventos.", beneficios: ["Comedor / viandas","Aguinaldo","Vacaciones pagas"], horario: "Turnos rotativos, mediodía y noche", buscan: ["Cocinero","Mozo/a","Limpieza"], sobre: "Cocina casera porteña, buen ambiente de equipo.", tel: "", logo: "", creado: now - 15*d },
    ],
    reviews: [
      { id: "r1", target: "t1", autor: "Constructora Andina", estrellas: 5, texto: "Muy responsable, terminó el revoque antes de lo previsto.", fecha: now - 12*d },
      { id: "r2", target: "t1", autor: "Marta P.", estrellas: 4, texto: "Buen trabajo de pintura, dejó todo limpio.", fecha: now - 4*d },
      { id: "r3", target: "t2", autor: "Kiosco El Sol", estrellas: 5, texto: "Rápida y clara con el presupuesto.", fecha: now - 3*d },
      { id: "r4", target: "e1", autor: "Ramiro Gómez", estrellas: 5, texto: "Pagan en fecha y te dan la ropa de trabajo.", fecha: now - 9*d },
      { id: "r5", target: "e2", autor: "Camila Ruiz", estrellas: 4, texto: "Buen equipo, los turnos a veces cambian sobre la marcha.", fecha: now - 2*d },
    ],
    session: null,
  };
}

let db;
function load() {
  try { const raw = localStorage.getItem(KEY); db = raw ? JSON.parse(raw) : seed(); }
  catch (e) { db = seed(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast("No hay espacio para guardar. Probá con menos fotos."); return false; }
}

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const money = n => "$" + Number(n || 0).toLocaleString("es-AR");
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function initials(n) { return String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }
function colorFor(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function avatar(p, cls = "") {
  const img = p.foto || p.logo;
  return `<div class="avatar ${cls}" style="background:${colorFor(p.id)}">${img ? `<img src="${img}" alt="">` : esc(initials(p.nombre))}</div>`;
}
function rating(id) {
  const rs = db.reviews.filter(r => r.target === id);
  const avg = rs.length ? rs.reduce((a, r) => a + r.estrellas, 0) / rs.length : 0;
  return { avg, count: rs.length };
}
function starStr(avg) { const f = Math.round(avg); return "★".repeat(f) + "☆".repeat(5 - f); }
function ratingHtml(id) {
  const { avg, count } = rating(id);
  return count ? `<span class="stars">${starStr(avg)}</span> <b>${avg.toFixed(1)}</b> <span class="muted">(${count})</span>` : `<span class="muted">Sin reseñas todavía</span>`;
}
function fecha(t) { return new Date(t).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" }); }
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
function waLink(tel, texto) {
  const num = String(tel || "").replace(/\D/g, "");
  return num ? `https://wa.me/${num}?text=${encodeURIComponent(texto)}` : "";
}
function me() {
  const s = db.session; if (!s) return null;
  const list = s.tipo === "t" ? db.workers : db.companies;
  return list.find(x => x.id === s.id) || null;
}

/* Achica la imagen antes de guardarla para no llenar el almacenamiento */
function compress(file, max = 900) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", .75));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- Navegación ---------- */
function renderNav(path) {
  const u = me();
  const links = [["#/trabajadores", "Trabajadores"], ["#/empresas", "Empresas"]];
  if (u) links.push([`#/${db.session.tipo}/${u.id}`, "Mi perfil"]);
  else links.push(["#/registro", "Crear perfil"]);
  $("#nav").innerHTML = links.map(([h, t]) => `<a href="${h}" class="${path.startsWith(h.slice(1)) ? "on" : ""}">${t}</a>`).join("")
    + (u ? `<a href="#/" id="salir">Salir</a>` : "");
  const s = $("#salir"); if (s) s.onclick = e => { e.preventDefault(); db.session = null; save(); if (location.hash === "#/") router(); else location.hash = "#/"; };
}

function router() {
  const path = location.hash.slice(1) || "/";
  const parts = path.split("/").filter(Boolean);
  renderNav(path);
  window.scrollTo(0, 0);
  const app = $("#app");
  if (!parts.length) return viewHome(app);
  if (parts[0] === "registro" && !parts[1]) return viewChooseRole(app);
  if (parts[0] === "registro" && parts[1] === "trabajador") return viewWorkerWizard(app);
  if (parts[0] === "registro" && parts[1] === "empresa") return viewCompanyForm(app);
  if (parts[0] === "trabajadores") return viewWorkers(app);
  if (parts[0] === "empresas") return viewCompanies(app);
  if (parts[0] === "t" && parts[1]) return viewWorker(app, parts[1]);
  if (parts[0] === "e" && parts[1]) return viewCompany(app, parts[1]);
  app.innerHTML = `<div class="empty"><h2>Página no encontrada</h2><a class="btn" href="#/">Volver al inicio</a></div>`;
}

/* ---------- Vistas ---------- */
function viewHome(app) {
  app.innerHTML = `
  <div class="hero">
    <div>
      <h1>Encontrar trabajo, <em>más fácil.</em></h1>
      <p class="lead">Workia te conecta directo con la empresa. Mostrá lo que sabés hacer, tus trabajos con fotos y tu precio. Las reseñas hacen el resto.</p>
      <div class="row"><span class="tag">${db.workers.length} trabajadores</span><span class="tag acc">${db.companies.length} empresas</span></div>
    </div>
    <div class="choose">
      <a href="#/registro/trabajador"><div class="k">Busco trabajo →</div><div class="t">Creá tu perfil con DNI, oficios, fotos de tus trabajos y tu precio.</div></a>
      <a href="#/registro/empresa"><div class="k">Busco trabajadores →</div><div class="t">Contá dónde están, sus obras, años de recorrido, beneficios y horarios.</div></a>
    </div>
  </div>
  <div class="steps3">
    <div class="card"><div class="n">1</div><h3>Armás tu perfil</h3><p class="muted">Verificás tu identidad con la foto del DNI y completás una encuesta corta.</p></div>
    <div class="card"><div class="n">2</div><h3>Te encuentran</h3><p class="muted">Las empresas buscan por oficio, zona, precio y puntuación.</p></div>
    <div class="card"><div class="n">3</div><h3>Contacto directo</h3><p class="muted">Hablan sin intermediarios y después se dejan reseñas mutuas.</p></div>
  </div>`;
}

function viewChooseRole(app) {
  app.innerHTML = `<div class="form"><h1>Crear perfil</h1><p class="muted">¿Cómo vas a usar Workia?</p>
    <div class="choose">
      <a href="#/registro/trabajador"><div class="k">Soy trabajador/a</div><div class="t">Quiero que las empresas me encuentren.</div></a>
      <a href="#/registro/empresa"><div class="k">Soy una empresa</div><div class="t">Quiero encontrar buenos trabajadores.</div></a>
    </div></div>`;
}

/* Registro de trabajador: encuesta en pasos */
let wz = null;
function viewWorkerWizard(app) {
  if (!wz) wz = { step: 0, dni: "", foto: "", nombre: "", oficios: [], otro: "", zona: "", fotos: [], sobre: "", precio: "", unidad: "hora", tel: "" };
  const steps = ["Identidad", "Qué sabés hacer", "De dónde sos", "Trabajos hechos", "Sobre vos", "Tu precio"];
  const s = wz.step;
  let body = "";
  if (s === 0) body = `
    <div class="field"><label for="nombre">Nombre y apellido</label><input id="nombre" type="text" value="${esc(wz.nombre)}" autocomplete="name"></div>
    <div class="field"><label>Foto de tu DNI (frente)</label>
      <div class="hint">Se usa sólo para verificar tu identidad. No se muestra en tu perfil.</div>
      <label class="drop"><input id="dniIn" type="file" accept="image/*" capture="environment">📷 Sacar o subir foto del DNI</label>
      ${wz.dni ? `<img class="dni-prev" src="${wz.dni}" alt="DNI cargado">` : ""}</div>
    <div class="field"><label>Foto de perfil <span class="muted">(opcional)</span></label>
      <label class="drop"><input id="fotoIn" type="file" accept="image/*">🙂 Subir foto tuya</label>
      ${wz.foto ? `<img class="dni-prev" style="max-width:120px;border-radius:50%" src="${wz.foto}" alt="Foto de perfil">` : ""}</div>`;
  if (s === 1) body = `
    <div class="field"><label>Elegí tus oficios</label><div class="hint">Podés marcar varios.</div>
      <div class="chips" id="ofi">${OFICIOS.map(o => `<span class="chip ${wz.oficios.includes(o) ? "on" : ""}" data-v="${esc(o)}">${esc(o)}</span>`).join("")}</div></div>
    <div class="field"><label for="otro">¿Otro? Escribilo</label><input id="otro" type="text" value="${esc(wz.otro)}" placeholder="Ej: Tapicero"></div>`;
  if (s === 2) body = `
    <div class="field"><label for="zona">Ciudad o barrio donde trabajás</label><input id="zona" type="text" list="zonas" value="${esc(wz.zona)}" placeholder="Ej: Córdoba Capital"></div>
    <div class="field"><label for="tel">WhatsApp para que te contacten</label><input id="tel" type="tel" value="${esc(wz.tel)}" placeholder="Ej: 5493511234567"><div class="hint">Con código de país y área, sin espacios.</div></div>`;
  if (s === 3) body = `
    <div class="field"><label>Fotos de trabajos que hiciste</label><div class="hint">Hasta 8 fotos. Es lo que más mira una empresa.</div>
      <label class="drop"><input id="fotosIn" type="file" accept="image/*" multiple>🖼️ Agregar fotos</label>
      <div class="thumbs">${wz.fotos.map((f, i) => `<div class="th"><img src="${f}" alt=""><button data-i="${i}" aria-label="Quitar">×</button></div>`).join("")}</div></div>`;
  if (s === 4) body = `
    <div class="field"><label for="sobre">Contá un poco de tu vida y experiencia</label>
      <textarea id="sobre" placeholder="Hace cuánto trabajás, dónde trabajaste, qué te diferencia…">${esc(wz.sobre)}</textarea></div>`;
  if (s === 5) body = `
    <div class="field"><label for="precio">¿Cuánto cobrás?</label>
      <div class="row"><input id="precio" type="number" min="0" step="100" value="${esc(wz.precio)}" style="flex:1;min-width:140px" placeholder="Ej: 9000">
      <select id="unidad" style="flex:1;min-width:140px">${Object.entries(UNIDADES).map(([k, v]) => `<option value="${k}" ${wz.unidad === k ? "selected" : ""}>${v}</option>`).join("")}</select></div></div>
    <p class="muted">Listo. Al guardar, tu perfil queda disponible para cuando una empresa busque por estas características.</p>`;

  app.innerHTML = `<div class="form card">
    <h2>Perfil de trabajador</h2>
    <div class="muted">Paso ${s + 1} de ${steps.length}: <b>${steps[s]}</b></div>
    <div class="progress">${steps.map((_, i) => `<i class="${i <= s ? "on" : ""}"></i>`).join("")}</div>
    ${body}
    <div class="err" id="err"></div>
    <div class="form-nav">
      <button class="btn ghost" id="back" ${s === 0 ? "disabled" : ""}>← Atrás</button>
      <button class="btn ${s === steps.length - 1 ? "alt" : ""}" id="next">${s === steps.length - 1 ? "Guardar perfil" : "Siguiente →"}</button>
    </div></div>
    <datalist id="zonas">${zonasSugeridas()}</datalist>`;

  const collect = () => {
    const v = id => { const el = $("#" + id); return el ? el.value.trim() : undefined; };
    if (s === 0) wz.nombre = v("nombre");
    if (s === 1) wz.otro = v("otro");
    if (s === 2) { wz.zona = v("zona"); wz.tel = v("tel"); }
    if (s === 4) wz.sobre = v("sobre");
    if (s === 5) { wz.precio = v("precio"); wz.unidad = v("unidad"); }
  };
  const onFile = (id, fn) => { const el = $("#" + id); if (el) el.onchange = async e => { collect(); await fn([...e.target.files]); viewWorkerWizard(app); }; };
  onFile("dniIn", async fs => { if (fs[0]) wz.dni = await compress(fs[0], 1000); });
  onFile("fotoIn", async fs => { if (fs[0]) wz.foto = await compress(fs[0], 300); });
  onFile("fotosIn", async fs => { for (const f of fs.slice(0, 8 - wz.fotos.length)) wz.fotos.push(await compress(f)); });
  app.querySelectorAll(".thumbs button").forEach(b => b.onclick = () => { wz.fotos.splice(+b.dataset.i, 1); viewWorkerWizard(app); });
  app.querySelectorAll("#ofi .chip").forEach(c => c.onclick = () => {
    const o = c.dataset.v; wz.oficios = wz.oficios.includes(o) ? wz.oficios.filter(x => x !== o) : [...wz.oficios, o];
    c.classList.toggle("on");
  });

  $("#back").onclick = () => { collect(); wz.step--; viewWorkerWizard(app); };
  $("#next").onclick = () => {
    collect();
    const err = msg => { $("#err").textContent = msg; };
    if (s === 0 && !wz.nombre) return err("Escribí tu nombre.");
    if (s === 0 && !wz.dni) return err("Subí la foto de tu DNI para verificar tu identidad.");
    if (s === 1 && !wz.oficios.length && !wz.otro) return err("Elegí al menos un oficio.");
    if (s === 2 && !wz.zona) return err("Decinos de dónde sos.");
    if (s === 4 && wz.sobre.length < 20) return err("Contá un poco más (mínimo 20 caracteres).");
    if (s === 5 && !(Number(wz.precio) > 0)) return err("Poné tu precio.");
    if (s < steps.length - 1) { wz.step++; return viewWorkerWizard(app); }
    const oficios = [...wz.oficios]; if (wz.otro) oficios.push(wz.otro);
    const w = { id: uid("t"), nombre: wz.nombre, foto: wz.foto, dni: wz.dni, dniOk: true, oficios, zona: wz.zona, tel: wz.tel, fotos: wz.fotos, sobre: wz.sobre, precio: Number(wz.precio), unidad: wz.unidad, creado: Date.now() };
    db.workers.unshift(w); db.session = { tipo: "t", id: w.id };
    if (!save()) { db.workers.shift(); db.session = null; return; }
    wz = null; toast("¡Perfil guardado!"); location.hash = "#/t/" + w.id;
  };
}

function zonasSugeridas() {
  const base = ["CABA","La Plata","Mar del Plata","Córdoba Capital","Rosario","Santa Fe","Mendoza","San Miguel de Tucumán","Salta","Neuquén","Bahía Blanca","Corrientes","Posadas","Resistencia","San Juan","Paraná"];
  const all = new Set([...base, ...db.workers.map(w => w.zona), ...db.companies.map(c => c.zona)]);
  return [...all].filter(Boolean).map(z => `<option value="${esc(z)}">`).join("");
}

/* Explorar trabajadores (lo que usa la empresa para buscar) */
const fw = { q: "", oficio: "", zona: "", max: "", min: 0, orden: "rating" };
function viewWorkers(app) {
  const allOf = [...new Set([...OFICIOS, ...db.workers.flatMap(w => w.oficios)])];
  app.innerHTML = `<h1>Trabajadores</h1><p class="muted">Buscá por lo que sabe hacer, de dónde es, su precio y sus reseñas.</p>
  <div class="layout">
    <details class="card filters" ${innerWidth > 760 ? "open" : ""}><summary>Filtros</summary>
      <div class="field"><label for="q">Buscar</label><input id="q" type="text" placeholder="Nombre o palabra clave" value="${esc(fw.q)}"></div>
      <div class="field"><label for="oficio">Oficio</label><select id="oficio"><option value="">Todos</option>${allOf.map(o => `<option ${fw.oficio === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>
      <div class="field"><label for="zona">Zona</label><input id="zona" type="text" list="zonas" value="${esc(fw.zona)}"></div>
      <div class="field"><label for="max">Precio máximo</label><input id="max" type="number" min="0" value="${esc(fw.max)}"></div>
      <div class="field"><label for="min">Puntuación mínima</label><select id="min">${[0,3,4,4.5].map(n => `<option value="${n}" ${fw.min == n ? "selected" : ""}>${n ? n + "★ o más" : "Cualquiera"}</option>`).join("")}</select></div>
      <div class="field"><label for="orden">Ordenar por</label><select id="orden">
        <option value="rating" ${fw.orden === "rating" ? "selected" : ""}>Mejor puntuados</option>
        <option value="precio" ${fw.orden === "precio" ? "selected" : ""}>Menor precio</option>
        <option value="nuevo" ${fw.orden === "nuevo" ? "selected" : ""}>Más nuevos</option></select></div>
    </details>
    <div><div class="muted" id="count" style="margin-bottom:10px"></div><div class="grid" id="list"></div></div>
  </div><datalist id="zonas">${zonasSugeridas()}</datalist>`;
  const draw = () => {
    let list = db.workers.filter(w => {
      const r = rating(w.id);
      if (fw.q && !norm(w.nombre + " " + w.sobre + " " + w.oficios.join(" ")).includes(norm(fw.q))) return false;
      if (fw.oficio && !w.oficios.includes(fw.oficio)) return false;
      if (fw.zona && !norm(w.zona).includes(norm(fw.zona))) return false;
      if (fw.max && w.precio > Number(fw.max)) return false;
      if (fw.min && r.avg < fw.min) return false;
      return true;
    });
    list.sort((a, b) => fw.orden === "precio" ? a.precio - b.precio : fw.orden === "nuevo" ? b.creado - a.creado : rating(b.id).avg - rating(a.id).avg);
    $("#count").textContent = `${list.length} resultado${list.length === 1 ? "" : "s"}`;
    $("#list").innerHTML = list.length ? list.map(w => `
      <a class="card pcard" href="#/t/${w.id}">
        <div class="row">${avatar(w)}<div><b>${esc(w.nombre)}</b>${w.dniOk ? ` <span class="verified" title="DNI verificado">✔</span>` : ""}<div class="muted" style="font-size:.9rem">📍 ${esc(w.zona)}</div></div></div>
        <div class="chips">${w.oficios.map(o => `<span class="tag">${esc(o)}</span>`).join("")}</div>
        <div>${ratingHtml(w.id)}</div>
        <div><span class="price">${money(w.precio)}</span> <span class="muted">${UNIDADES[w.unidad] || ""}</span></div>
      </a>`).join("") : `<div class="empty">No encontramos trabajadores con esos filtros.</div>`;
  };
  ["q","oficio","zona","max","min","orden"].forEach(id => $("#" + id).oninput = e => { fw[id] = id === "min" ? Number(e.target.value) : e.target.value; draw(); });
  draw();
}

  </section>`;
}

function bindProfile(app, id) {
  app.querySelectorAll(".gallery img").forEach(img => img.onclick = () => {
    const lb = document.createElement("div"); lb.className = "lightbox";
    lb.innerHTML = `<img src="${img.src}" alt="">`; lb.onclick = () => lb.remove();
    document.body.appendChild(lb);
  });
  const pick = $("#pick"); if (!pick) return;
  let n = 0;
  pick.querySelectorAll("button").forEach(b => b.onclick = () => {
    n = +b.dataset.n; pick.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n <= n));
  });
  $("#rSend").onclick = () => {
    const autor = $("#rAutor").value.trim(), texto = $("#rTexto").value.trim();
    if (!n) return $("#rErr").textContent = "Elegí cuántas estrellas.";
    if (!autor) return $("#rErr").textContent = "Poné tu nombre.";
    if (texto.length < 5) return $("#rErr").textContent = "Escribí un comentario.";
    db.reviews.push({ id: uid("r"), target: id, autor, estrellas: n, texto, fecha: Date.now() });
    save(); toast("¡Gracias por tu reseña!"); router();
  };
}

load();
window.addEventListener("hashchange", router);
router();
</script>
